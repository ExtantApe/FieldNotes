name: FieldNotes
version: '${version}'
main: com.extantape.fieldnotes.FieldNotesPlugin
api-version: '26.1'
description: Testers type /bug to leave a private note with where they were, and their last moments are saved if the game crashes.
website: https://github.com/ExtantApe/FieldNotes
permissions:
  fieldnotes.note:
    description: Use /bug to leave a note.
    default: true
  fieldnotes.watched:
    description: Keep a short record of this player's recent actions, saved when they leave or the server stops.
    default: true
