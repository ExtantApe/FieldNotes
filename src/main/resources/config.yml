# Fieldnotes: /bug notes and a short record of recent actions, for play tests. Everything stays in this folder,
# readable as plain text. Nothing is ever shown in chat except the note-taker's own "Noted".

# How many recent actions to keep per player. The oldest drop off.
recent-actions: 80

# How often the recent actions are written to disk, in seconds, so a hard crash loses at most this much.
flush-seconds: 5

# Commands are recorded by their name only (such as "/home"), never with what was typed after it, so private
# messages and passwords never reach the file.
